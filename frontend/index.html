<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Dark theme color — shows in Chrome address bar & Android -->
    <meta name="theme-color" content="#111111" />

    <!-- Favicon — black background, no white -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- SEO -->
    <title>InkWire — The World's Most Important Stories</title>
    <meta name="description" content="InkWire delivers AI-powered, editorially reviewed global news covering world events, India, technology, business, science, and politics." />

    <!-- Social sharing preview (WhatsApp, Twitter, LinkedIn) -->
    <meta property="og:title" content="InkWire — The World's Most Important Stories" />
    <meta property="og:description" content="AI-powered news, editorially reviewed for accuracy and balance." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
