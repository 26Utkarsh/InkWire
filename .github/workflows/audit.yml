name: Security Audit

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  audit:
    name: Run npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend
        run: |
          cd backend
          npm audit --audit-level=high

      - name: Audit Frontend
        run: |
          cd frontend
          npm audit --audit-level=high
