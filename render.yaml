# render.yaml — Full InkWire deployment on Render only
# Both backend (Web Service) + frontend (Static Site) in one file.
# Render auto-detects this file from your repo root.

services:
  # ── BACKEND ─────────────────────────────────────────────────
  - type: web
    name: inkwire-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: starter          # $7/mo — required for always-on cron jobs
    # plan: free           # ← use this if you want free (crons will sleep after 15 min idle)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://inkwire.onrender.com   # update after frontend deploys
      - key: MONGODB_URI
        sync: false        # fill in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        sync: false

  # ── FRONTEND ────────────────────────────────────────────────
  - type: web
    name: inkwire
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://inkwire-backend.onrender.com
